# Hue Entertainment - Home Assistant app manifest.
#
# Streams LedFX pixel output to Philips Hue bulbs paired to zigbee2mqtt (no Hue
# Bridge) at 20-25 fps, using the reverse-engineered Hue Entertainment Zigbee
# protocol through Z2M's generic zclcommand passthrough. LedFX sends each zone
# as a small DDP stream (one pixel per bulb); this app converts frames to
# entertainment commands aimed at one "proxy" bulb per zone, which re-broadcasts
# to the rest. Requires zigbee2mqtt >= 2.1.1 and color-capable Hue bulbs.
name: Hue Entertainment
version: "0.3.1"
slug: hue_ent
description: >-
  Audio-reactive Hue: stream LedFX effects to Philips Hue Zigbee bulbs on
  zigbee2mqtt at 20-25 fps - no Hue Bridge, no per-bulb command spam.
url: https://github.com/adamoberley/ha-addons/tree/main/hue_ent

arch:
  - aarch64
  - amd64

init: false
startup: application
boot: auto

# Sidebar zone editor: rooms are auto-discovered; the GUI handles the human
# parts (pixel order with per-bulb blink, proxy choice, brightness, enable).
ingress: true
ingress_port: 8127
panel_icon: mdi:track-light
panel_title: Hue Entertainment

# host_network so the LedFX app (also host_network) can reach the per-zone DDP
# UDP listeners directly on the host address.
host_network: true

# Auto-discover the co-located Mosquitto broker credentials from the Supervisor.
services:
  - mqtt:need

# Used to pause/resume the configured pause_entities (e.g. an Adaptive Lighting
# switch) around a streaming session via the Core service API.
homeassistant_api: true

options:
  log_level: info
  auto_zones: true
  ledfx_url: "http://127.0.0.1:8888"
  ledfx_ddp_target: "127.0.0.1"
  zones: []

schema:
  # App log verbosity.
  log_level: list(debug|info|warning|error)
  # Build zones automatically: color-capable Philips Hue bulbs are grouped by
  # their Home Assistant area (one zone per room), and each room's Adaptive
  # Lighting switch is picked up as a pause entity. Fine-tune (pixel order,
  # proxy, brightness, enable/disable) in the sidebar panel. Disable to define
  # every zone by hand below.
  auto_zones: bool
  # LedFX API base URL for auto-provisioning: the app creates one matching DDP
  # device per zone in LedFX (named "Hue <zone>"), so there's nothing to mirror
  # by hand. The default reaches the LedFX app on the same host. Set it to an
  # empty string to disable auto-provisioning.
  ledfx_url: str
  # The address LedFX should send DDP to - i.e. where THIS app is reachable
  # from LedFX. Leave at 127.0.0.1 when both apps run on the same host.
  ledfx_ddp_target: str
  # MANUAL zones (advanced; not needed when auto_zones covers you - a manual
  # zone with the same name as a room replaces the auto one). Lights are
  # zigbee2mqtt friendly names, in
  # pixel order (arrange them along the room so 1-D effects sweep spatially).
  # A zone is capped at 10 lights by the Zigbee frame format. The proxy bulb
  # re-broadcasts frames and must be in radio range of every other bulb in the
  # zone (defaults to the first light). Every zone needs its own ddp_port
  # (defaults to 4048 + zone index).
  zones:
    - name: str
      lights:
        - str
      proxy: str?
      fps: int(5,25)?
      ddp_port: port?
      idle_timeout_s: int(5,600)?
      auto_start: bool?
      brightness_scale: float(0.05,1.0)?
      pause_entities:
        - str?
